spring.application.name=servico-vendas
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:ctn_db_ecommerce_vendas}:5432/${DB_NAME:db_ecommerce_vendas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=servico-vendas

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://servico-auth:8080